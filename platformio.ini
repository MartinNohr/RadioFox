[env:lilygo-t-display]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; platform = platformio/espressif32
board = lilygo-t-display
framework = arduino
; platform_packages =
;     framework-arduinoespressif32 @ 2.0.17
lib_deps = 
	madhephaestus/ESP32Encoder@^0.12.0
	bodmer/TFT_eSPI@^2.5.43
monitor_speed = 115200
build_flags =
  -D USER_SETUP_LOADED=1
  -include $PROJECT_LIBDEPS_DIR/$PIOENV/TFT_eSPI/User_Setups/Setup25_TTGO_T_Display.h
; board_build.partitions = app3M_spiffs9M_fact512k_16MB.csv
; board_build.partitions = max_app_4MB.csv
[platformio]
description = Radio Fox Files
